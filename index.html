<title>Mon coin d'étude</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Nunito","Trebuchet MS","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:#343a40;
  background:linear-gradient(160deg,#e7f5ff 0%,#f3f0ff 50%,#fff0f6 100%);min-height:100vh}
header{text-align:center;padding:28px 16px 6px}
header h1{margin:0;font-size:34px;letter-spacing:.5px}
header h1 span{display:inline-block;animation:flotte 3s ease-in-out infinite}
header p{margin:6px 0 0;color:#666;font-weight:700}
@keyframes flotte{50%{transform:translateY(-6px) rotate(-4deg)}}
main{max-width:860px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.m{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:1/1;
  background:#fff;border:4px solid var(--c);border-radius:24px;box-shadow:0 6px 0 var(--c);text-decoration:none;color:var(--texte,#343a40);
  transition:transform .1s}
.m:active{transform:translateY(4px);box-shadow:0 2px 0 var(--c)}
.m .ic{font-size:52px}
.m .n{font-weight:900;font-size:18px;color:var(--c)}
.m.off{filter:grayscale(1);opacity:.55;pointer-events:none}
.m .bientot{position:absolute;top:8px;right:8px;background:#495057;color:#fff;font-size:11px;font-weight:800;border-radius:8px;padding:2px 6px}
footer{text-align:center;color:#868e96;font-size:13px;padding:0 16px 24px}
footer img{height:22px;vertical-align:middle}
</style>
</head>
